name: Firestore Rules Tests

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "index.html"
      - "staff.html"
      - "staff.js"
      - "app.js"
      - "security-tests/**"
      - ".github/workflows/firestore-rules-tests.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "security-tests/**"
      - ".github/workflows/firestore-rules-tests.yml"

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check client JavaScript syntax
        run: |
          node --check --input-type=module < app.js
          node --check --input-type=module < staff.js
      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firestore Rules tests in the Emulator
        run: npx firebase emulators:exec --project demo-quorista-client-platform --only firestore "npm run test:rules"
